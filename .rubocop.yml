# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

# Overwrite or add rules to create your own house style
#
# # Use `[a, [b, c]]` not `[ a, [ b, c ] ]`
# Layout/SpaceInsideArrayLiteralBrackets:
#   Enabled: false

inherit_mode:
  merge:
    - Exclude

AllCops:
  Exclude:
    # ruby.wasm checks CRuby out and builds it under build/; the browser shell's packages under pwa/.
    - "build/**/*"
    - "rubies/**/*"
    - "pwa/node_modules/**/*"
