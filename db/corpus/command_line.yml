slug: command_line
title: The Rails Command Line
description: There are a few commands that are absolutely critical to your everyday usage of Rails. This guide covers the command line tools provided by Rails.
url: https://guides.rubyonrails.org/v8.1/command_line.html
source: https://github.com/rails/rails/blob/v8.1.4/guides/source/command_line.md
ref: v8.1.4
sections:
- anchor: overview
  title: Overview
  parent:
  body: |-
    The Rails command line is a powerful part of the Ruby on Rails framework. It allows you to quickly start a new application by generating boilerplate code (that follows Rails conventions). This guide includes an overview of Rails commands that allow you to manage all aspects of your web application, including the database.

    You can get a list of commands available to you, which will often depend on your current directory, by typing bin/rails --help. Each command has a description to help clarify what it does.

    The output of bin/rails --help then proceeds to list all commands in alphabetical order, with a short description of each:

    In addition to bin/rails --help, running any command from the list above with the --help flag can also be useful. For example, you can learn about the options that can be used with bin/rails routes:

    Most Rails command line subcommands can be run with --help (or -h) and the output can be very informative. For example bin/rails generate model --help prints two pages of description, in addition to usage and options:

    Some of the most commonly used commands are:

    bin/rails console
    bin/rails server
    bin/rails test
    bin/rails generate
    bin/rails db:migrate
    bin/rails db:create
    bin/rails routes
    bin/rails dbconsole
    rails new app_name

    We'll cover the above commands (and more) in the following sections, starting with the command for creating a new application.
- anchor: creating-a-new-rails-application
  title: Creating a New Rails Application
  parent:
  body: |-
    We can create a brand new Rails application using the rails new command.

    You will need the rails gem installed in order to run the rails new command. You can do this by typing gem install rails - for more step-by-step instructions, see the Installing Ruby on Rails guide.

    With the new command, Rails will set up the entire default directory structure along with all the code needed to run a sample application right out of the box. The first argument to rails new is the application name:

    You can pass options to the new command to modify its default behavior. You can also create application templates and use them with the new command.
- anchor: configure-a-different-database
  title: Configure a Different Database
  parent: Creating a New Rails Application
  body: |-
    When creating a new Rails application, you can specify a preferred database for your application by using the --database option. The default database for rails new is SQLite. For example, you can set up a PostgreSQL database like this:

    The main difference is the content of the config/database.yml file. With the PostgreSQL option, it looks like this:

    The --database=postgresql option will also modify other files generated for a new Rails app appropriately, such as adding the pg gem to the Gemfile, etc.
- anchor: skipping-defaults
  title: Skipping Defaults
  parent: Creating a New Rails Application
  body: |-
    The rails new command by default creates dozens of files. By using the --skip option, you can skip some files from being generated if you don't need them. For example,

    In the above example, Action Mailbox and Action Text are skipped in addition to Active Storage because they depend on Active Storage functionality.

    You can get a full list of what can be skipped in the options section of rails new --help command.
- anchor: starting-a-rails-application-server
  title: Starting a Rails Application Server
  parent:
  body: |-
    We can start a Rails application using the bin/rails server command, which launches the Puma web server that comes bundled with Rails. You'll use this any time you want to access your application through a web browser.

    With just two commands we have a Rails application up and running. The server command starts the application listening on port 3000 by default. You can open your browser to http://localhost:3000 to see a basic Rails application running.

    Most common commands have a shortcut aliases. To start the server you can use the alias "s": bin/rails s.

    You can run the application on a different port using the -p option. You can also change the environment using -e (default is development).

    The -b option binds Rails to the specified IP address, by default it is localhost. You can run a server as a daemon by passing a -d option.
- anchor: generating-code
  title: Generating Code
  parent:
  body: |-
    You can use the bin/rails generate command to generate a number of different files and add functionality to your application, such as models, controllers, and full scaffolds.

    To see a list of built-in generators, you can run bin/rails generate (or bin/rails g for short) without any arguments. It lists all available generators after the usage. You can also learn more about what a specific generator will do by using the --pretend option.

    When you add certain gems to your application, they may install more generators. You can also create your own generators, see the Generators guide for more information.

    The purpose of Rails' built-in generators is to save you time by freeing you from having to write repetitive boilerplate code.

    Let's add a controller with the controller generator.
- anchor: generating-controllers
  title: Generating Controllers
  parent: Generating Code
  body: |-
    We can find out exactly how to use the controller generator with the bin/rails generate controller command (which is the same as using it with --help). There is a "Usage" section and even an example:

    The controller generator is expecting parameters in the form of generate controller ControllerName action1 action2. Let's make a Greetings controller with an action of hello, which will say something nice to us.

    The above command created various files at specific directories. It created a controller file, a view file, a functional test file, a helper for the view, and added a route.

    To test out the new controller, we can modify the hello action and the view to display a message:

    Then, we can start the Rails server, with bin/rails server, and go to the added route http://localhost:3000/greetings/hello to see the message.

    Now let's use the generator to add models to our application.
- anchor: generating-models
  title: Generating Models
  parent: Generating Code
  body: |-
    The Rails model generator command has a very detailed "Description" section that is worth reading. Here is the basic usage:

    As an example, we can generate a post model like this:

    The model generator adds test files as well as a migration, which you'll need to run with bin/rails db:migrate.

    For a list of available field types for the type parameter, refer to the API documentation. The index parameter generates a corresponding index for the column. If you don't specify a type for a field, Rails will default to type string.

    In addition to generating controllers and models separately, Rails also provides generators that add code for both at once as well as other files needed for a standard CRUD resource. There are two generator commands that do this: resource and scaffold. The resource command is more lightweight than scaffold and generates less code.
- anchor: generating-resources
  title: Generating Resources
  parent: Generating Code
  body: |-
    The bin/rails generate resource command generates model, migration, empty controller, routes, and tests. It does not generate views and it does not fill in the controller with CRUD methods.

    Here are all the files generated with the resource command for post:

    Use the resource command when you don't need views (e.g. writing an API) or prefer to add controller actions manually.
- anchor: generating-scaffolds
  title: Generating Scaffolds
  parent: Generating Code
  body: |-
    A Rails scaffold generates a full set of files for a resource, including a model, controller, views (HTML and JSON), routes, migration, tests, and helper files. It can be used for quickly prototyping CRUD interfaces or when you want to generate the basic structure of a resource as a starting point that you can customize.

    If you scaffold the post resource you can see all of the files mentioned above being generated:

    At this point, you can run bin/rails db:migrate to create the post table (see Managing the Database for more on that command). Then, if you start the Rails server with bin/rails server and navigate to http://localhost:3000/posts, you will be able to interact with the post resource - see a list of posts, create new posts, as well as edit and delete them.

    The scaffold generates test files, though you will need to modify them and actually add test cases for your code. See the Testing guide for an in-depth look at creating and running tests.
- anchor: undoing-code-generation-with-bin-rails-destroy
  title: Undoing Code Generation with bin/rails destroy
  parent: Generating Code
  body: |-
    Imagine you made a typing error when using the generate command for a model (or controller or scaffold or anything), it would be tedious to manually delete each file that was created by the generator. Rails provides a destroy command for that reason. You can think of destroy as the opposite of generate. It'll figure out what generate did, and undo it.

    You can also use the alias "d" to invoke the destroy command: bin/rails d.

    For example, if you meant to generate an article model but instead typed artcle:

    You can undo the generate command with destroy like this:
- anchor: bin-rails-console
  title: bin/rails console
  parent: Interacting with a Rails Application
  body: |-
    The bin/rails console command loads a full Rails environment (including models, database, etc.) into an interactive IRB style shell. It is a powerful feature of the Ruby on Rails framework as it allows you to interact with, debug and explore your entire application at the command line.

    The Rails Console can be useful for testing out ideas by prototyping with code and for creating and updating records in the database without needing to use a browser.

    The Rails Console has several useful features. For example, if you wish to test out some code without changing any data, you can use sandbox mode with bin/rails console --sandbox. The sandbox mode wraps all database operations in a transaction that rolls back when you exit:

    The sandbox option is great for safely testing destructive changes without affecting your database.

    You can also specify the Rails environment for the console command with the -e option:

    The app Object

    Inside the Rails Console you have access to the app and helper instances.

    With the app method you can access named route helpers:

    You can also use the app object to make requests of your application without starting a real server:

    You have to pass the "Host" header with the app.get request above, because the Rack client used under-the-hood defaults to "www.example.com" if not "Host" is specified. You can modify your application to always use localhost using a configuration or an initializer.

    The reason you can "make requests" like above is because the app object is the same one that Rails uses for integration tests:

    The app object exposes methods like app.cookies, app.session, app.post, and app.response. This way you can simulate and debug integration tests in the Rails Console.

    The helper Object

    The helper object in the Rails console is your direct portal into Rails’ view layer. It allows you to test out view-related formatting and utility methods in the console, as well as custom helpers defined in your application (i.e. in app/helpers).

    Assuming a custom_helper method is defined in a app/helpers/*_helper.rb file:
- anchor: bin-rails-dbconsole
  title: bin/rails dbconsole
  parent: Interacting with a Rails Application
  body: |-
    The bin/rails dbconsole command figures out which database you're using and drops you into the command line interface appropriate for that database. It also figures out the command line parameters to start a session based on your config/database.yml file and current Rails environment.

    Once you're in a dbconsole session, you can interact with your database directly as you normally would. For example, if you're using PostgreSQL, running bin/rails dbconsole may look like this:

    The dbconsole command is a very convenient shorthand, it's equivalent to running the psql command (or mysql or sqlite) with the appropriate arguments from your database.yml:

    So if your database.yml file looks like this:

    Running the bin/rails dbconsole command is the same as:

    The dbconsole command supports MySQL (including MariaDB), PostgreSQL, and SQLite3. You can also use the alias "db" to invoke the dbconsole: bin/rails db.

    If you are using multiple databases, bin/rails dbconsole will connect to the primary database by default. You can specify which database to connect to using --database or --db:
- anchor: bin-rails-runner
  title: bin/rails runner
  parent: Interacting with a Rails Application
  body: |-
    The runner command executes Ruby code in the context of the Rails application without having to open a Rails Console. This can be useful for one-off tasks that do not need the interactivity of the Rails Console. For instance:

    You can specify the environment in which the runner command should operate using the -e switch.

    You can also execute code in a Ruby file with the runner command, in the context of your Rails application:

    By default, bin/rails runner scripts are automatically wrapped with the Rails Executor (which is an instance of ActiveSupport::Executor) associated with your Rails application. The Executor creates a “safe zone” to run arbitrary Ruby inside a Rails app so that the autoloader, middleware stack, and Active Support hooks all behave consistently.

    Therefore, executing bin/rails runner lib/path_to_ruby_script.rb is functionally equivalent to the following:

    If you have a reason to opt of this behavior, there is a --skip-executor option.
- anchor: bin-rails-boot
  title: bin/rails boot
  parent: Interacting with a Rails Application
  body: |-
    The bin/rails boot command is a low-level Rails command whose entire job is to boot your Rails application. Specifically it loads config/boot.rb and config/application.rb files so that the application environment is ready to run.

    The boot command boots the application and exits — it does nothing else. It can be useful for debugging boot problems. If your app fails to start and you want to isolate the boot phase (without running migrations, starting the server, etc.), bin/rails boot can be a simple test.

    It can also be useful for timing application initialization. You can profile how long your application takes to boot by wrapping bin/rails boot in a profiler.
- anchor: bin-rails-routes
  title: bin/rails routes
  parent: Inspecting an Application
  body: |-
    The bin/rails routes command lists all defined routes in your application, including the URI Pattern and HTTP verb, as well as the Controller Action it maps to.

    This can be useful for tracking down a routing issue, or simply getting an overview of the resources and routes that are part of a Rails application. You can also narrow down the output of the routes command with options like --controller(-c) or --grep(-g):

    There is also an option, bin/rails routes --expanded, that displays even more information about each route, including the line number in your config/routes.rb where that route is defined:

    In development mode, you can also access the same routes info by going to http://localhost:3000/rails/info/routes
- anchor: bin-rails-about
  title: bin/rails about
  parent: Inspecting an Application
  body: |-
    The bin/rails about command displays information about your Rails application, such as Ruby, RubyGems, and Rails versions, database adapter, schema version, etc. It is useful when you need to ask for help or check if a security patch might affect you.
- anchor: bin-rails-initializers
  title: bin/rails initializers
  parent: Inspecting an Application
  body: |-
    The bin/rails initializers command prints out all defined initializers in the order they are invoked by Rails:

    This command can be useful when initializers depend on each other and the order in which they are run matters. Using this command, you can see what's run before/after and discover the relationship between initializers. Rails runs framework initializers first and then application ones, defined in config/initializers.
- anchor: bin-rails-middleware
  title: bin/rails middleware
  parent: Inspecting an Application
  body: |-
    The bin/rails middleware shows you the entire Rack middleware stack for your Rails application, in the exact order the middlewares are run for each request.

    This can be useful to see which middleware Rails includes and which ones are added by gems (Warden::Manager from Devise) as well as for debugging and profiling.
- anchor: bin-rails-stats
  title: bin/rails stats
  parent: Inspecting an Application
  body: |-
    The bin/rails stats command shows you things like lines of code (LOC) and the number of classes and methods for various components in your application.
- anchor: bin-rails-time-zones-all
  title: bin/rails time:zones:all
  parent: Inspecting an Application
  body: |-
    Thebin/rails time:zones:all command prints the complete list of time zones that Active Support knows about, along with their UTC offsets followed by the Rails timezone identifiers.

    As an example, you can use bin/rails time:zones:local to see your system's timezone:

    This can be useful when setting config.time_zone in config/application.rb, when you need an exact Rails time zone name and spelling (e.g., "Pacific Time (US & Canada)"), to validate user input or when debugging.
- anchor: managing-assets
  title: Managing Assets
  parent:
  body: |-
    The bin/rails assets:* commands allow you to manage assets in the app/assets directory.

    You can get a list of all commands in the assets: namespace like this:

    You can precompile the assets in app/assets using bin/rails assets:precompile. See the Asset Pipeline guide for more on precompiling.

    You can remove older compiled assets using bin/rails assets:clean. The assets:clean command allows for rolling deploys that may still be linking to an old asset while the new assets are being built.

    If you want to clear public/assets completely, you can use bin/rails assets:clobber. assets:clobber`.
- anchor: managing-the-database
  title: Managing the Database
  parent:
  body: |-
    The commands in this section, bin/rails db:*, are all about setting up databases, managing migrations, etc.

    You can get a list of all commands in the db: namespace like this:
- anchor: database-setup
  title: Database Setup
  parent: Managing the Database
  body: |-
    The db:create and db:drop commands create or delete the database for the current environment (or all environments with the db:create:all, db:drop:all)

    The db:seed command loads sample data from db/seeds.rb and the db:seed:replant command truncates tables of each database for the current environment and then loads the seed data.

    The db:setup command creates all databases, loads all schemas, and initializes with the seed data (it does not drop databases first, like the db:reset command below).

    The db:reset command drops and recreates all databases from their schema for the current environment and loads the seed data (so it's a combination of the above commands).

    For more on seed data, see this section of the Active Record Migrations guide.
- anchor: migrations
  title: Migrations
  parent: Managing the Database
  body: |-
    The db:migrate command is one of the most frequently run commands in a Rails application; it migrates the database by running all new (not yet run) migrations.

    The db:migrate:up command runs the "up" method and the db:migrate:down command runs the "down" method for the migration specified by the VERSION argument.

    The db:rollback command rolls the schema back to the previous version (or you can specify steps with the STEP=n argument).

    The db:migrate:redo command rolls back the database one migration and re-migrates up. It is a combination of the above two commands.

    There is also a db:migrate:status command, which shows which migrations have been run and which are still pending:

    Please see the Migration Guide for an explanation of concepts related to database migrations and other migration commands.
- anchor: schema-management
  title: Schema Management
  parent: Managing the Database
  body: |-
    There are two main commands that help with managing the database schema in your Rails application: db:schema:dump and db:schema:load.

    The db:schema:dump command reads your database’s current schema and writes it out to the db/schema.rb file (or db/structure.sql if you’ve configured the schema format to sql). After running migrations, Rails automatically calls schema:dump so your schema file is always up to date (and doesn't need to be modified manually).

    The schema file is a blueprint of your database and it is useful for setting up new environments for tests or development. It’s version-controlled, so you can see changes to the schema over time.

    The db:schema:load command drops and recreates the database schema from db/schema.rb (or db/structure.sql). It does this directly, without replaying each migration one at a time.

    This command is useful for quickly resetting a database to the current schema without running years of migrations one by one. For example, running db:setup also calls db:schema:load after creating the database and before seeding it.

    You can think of db:schema:dump as the one that writes the schema.rb file and db:schema:load as the one that reads that file.
- anchor: other-utility-commands
  title: Other Utility Commands
  parent: Managing the Database
  body: |-
    bin/rails db:version

    The bin/rails db:version command will show you the current version of the database, which can be useful for troubleshooting.

    db:fixtures:load

    The db:fixtures:load command loads fixtures into the current environment's database. To load specific fixtures, you can use FIXTURES=x,y. To load from a subdirectory in test/fixtures, use FIXTURES_DIR=z.

    db:system:change

    In an existing Rails application, it's possible to switch to a different database. The db:system:change command helps with that by changing the config/database.yml file and your database gem to the target database.

    db:encryption:init

    The db:encryption:init command generates a set of keys for configuring Active Record encryption in a given environment.
- anchor: running-tests
  title: Running Tests
  parent:
  body: |-
    The bin/rails test command helps you run the different types of tests in your application. The bin/rails test --help output has good examples of the different options for this command:

    You can run a single test by appending a line number to a filename:

    You can run multiple tests within a line range by appending the line range to a filename:

    You can run multiple files and directories at the same time:

    Rails comes with a testing framework called Minitest and there are also Minitest options you can use with the test command:

    Please see the Testing Guide for explanations and examples of different types of tests.
- anchor: bin-rails-notes
  title: bin/rails notes
  parent: Other Useful Commands
  body: |-
    The bin/rails notes command searches through your code for comments beginning with a specific keyword. You can refer to bin/rails notes --help for information about usage.

    By default, it will search in app, config, db, lib, and test directories for FIXME, OPTIMIZE, and TODO annotations in files with extension .builder, .rb, .rake, .yml, .yaml, .ruby, .css, .js, and .erb.

    Annotations

    You can pass specific annotations by using the -a (or --annotations) option. Note that annotations are case sensitive.

    Add Tags

    You can add more default tags to search for by using config.annotations.register_tags:

    Add Directories

    You can add more default directories to search from by using config.annotations.register_directories:

    Add File Extensions

    You can add more default file extensions by using config.annotations.register_extensions:
- anchor: bin-rails-tmp
  title: 'bin/rails tmp:'
  parent: Other Useful Commands
  body: |-
    The Rails.root/tmp directory is, like the *nix /tmp directory, the holding place for temporary files like process id files and cached actions.

    The tmp: namespaced commands will help you clear and create the Rails.root/tmp directory:
- anchor: bin-rails-secret
  title: bin/rails secret
  parent: Other Useful Commands
  body: |-
    The bin/rails secret command generates a cryptographically secure random string for use as a secret key in your Rails application.

    It can be useful for setting the secret key in your application's config/credentials.yml.enc file.
- anchor: bin-rails-credentials
  title: bin/rails credentials
  parent: Other Useful Commands
  body: |-
    The credentials commands provide access to encrypted credentials, so you can safely store access tokens, database passwords, and the like inside the app without relying on a bunch of environment variables.

    To add values to the encrypted YML file config/credentials.yml.enc, you can use the credentials:edit command:

    This opens the decrypted credentials in an editor (set by $VISUAL or $EDITOR) for editing. When saved, the content is encrypted automatically.

    You can also use the :show command to view the decrypted credential file, which may look something like this (This is from a sample application and not sensitive data):

    You can learn about credentials in the Rails Security Guide.

    Check out the detailed description for this command in the output of bin/rails credentials --help.
- anchor: custom-rake-tasks
  title: Custom Rake Tasks
  parent:
  body: |-
    You may want to create custom rake tasks in your application, to delete old records from the database for example. You can do this with the the bin/rails generate task command. Custom rake tasks have a .rake extension and are placed in the lib/tasks folder in your Rails application. For example:

