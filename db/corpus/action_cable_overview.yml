- anchor: example-1-user-appearances
  title: 'Example 1: User Appearances'
  parent: Full-Stack Examples
  body: |-
    Here's a simple example of a channel that tracks whether a user is online or not and what page they're on. (This is useful for creating presence features like showing a green dot next to a username if they're online).

    Create the server-side appearance channel:

    When a subscription is initiated the subscribed callback gets fired, and we take that opportunity to say "the current user has indeed appeared". That appear/disappear API could be backed by Redis, a database, or whatever else.

    Create the client-side appearance channel subscription:

    Client-Server Interaction

    Client connects to the Server via createConsumer(). (consumer.js). The Server identifies this connection by current_user.

    Client subscribes to the appearance channel via consumer.subscriptions.create({ channel: "AppearanceChannel" }). (appearance_channel.js)

    Server recognizes a new subscription has been initiated for the appearance channel and runs its subscribed callback, calling the appear method on current_user. (appearance_channel.rb)

    Client recognizes that a subscription has been established and calls connected (appearance_channel.js), which in turn calls install and appear. appear calls AppearanceChannel#appear(data) on the server, and supplies a data hash of { appearing_on: this.appearingOn }. This is possible because the server-side channel instance automatically exposes all public methods declared on the class (minus the callbacks), so that these can be reached as remote procedure calls via a subscription's perform method.

    Server receives the request for the appear action on the appearance channel for the connection identified by current_user (appearance_channel.rb). Server retrieves the data with the :appearing_on key from the data hash and sets it as the value for the :on key being passed to current_user.appear.
