  title: has_one_attached
  parent: Attaching Files to Records
  body: |-
    The has_one_attached macro sets up a one-to-one mapping between records and files. Each record can have one file attached to it.

    For example, suppose your application has a User model. If you want each user to have an avatar, define the User model as follows:

    or if you are using Rails 6.0+, you can run a model generator command like this:

    You can create a user with an avatar:

    Call avatar.attach to attach an avatar to an existing user:

    Call avatar.attached? to determine whether a particular user has an avatar:

    In some cases you might want to override a default service for a specific attachment. You can configure specific services per attachment using the service option with the name of your service:

    You can configure specific variants per attachment by calling the variant method on yielded attachable object:

    Call avatar.variant(:thumb) to get a thumb variant of an avatar:

    You can use specific variants for previews as well:

    If you know in advance that your variants will be accessed, you can specify that Rails should generate them ahead of time:

    Rails will enqueue a job to generate the variant after the attachment is attached to the record.

    Since Active Storage relies on polymorphic associations, and polymorphic associations rely on storing class names in the database, that data must remain synchronized with the class name used by the Ruby code. When renaming classes that use has_one_attached, make sure to also update the class names in the active_storage_attachments.record_type polymorphic type column of the corresponding rows.
- anchor: attaching-files-to-records-has-many-attached
  title: has_many_attached
  parent: Attaching Files to Records
  body: |-
    The has_many_attached macro sets up a one-to-many relationship between records and files. Each record can have many files attached to it.

    For example, suppose your application has a Message model. If you want each message to have many images, define the Message model as follows:

