  parent: Displaying Images, Videos, and PDFs
  body: |-
    By default, Active Storage will process representations lazily. This code:

    Will generate an <img> tag with the src pointing to the ActiveStorage::Representations::RedirectController. The browser will make a request to that controller, which will perform the following:

    Process file and upload the processed file if necessary.
    Return a 302 redirect to the file either to
    the remote service (e.g., S3).
    or ActiveStorage::Blobs::ProxyController which will return the file contents if proxy mode is enabled.

    Loading the file lazily allows features like single use URLs to work without slowing down your initial page loads.

    This works fine for most cases.

    If you want to generate URLs for images immediately, you can call .processed.url:

    The Active Storage variant tracker improves performance of this, by storing a record in the database if the requested representation has been processed before. Thus, the above code will only make an API call to the remote service (e.g. S3) once, and once a variant is stored, will use that. The variant tracker runs automatically, but can be disabled through config.active_storage.track_variants.

    If you're rendering lots of images on a page, the above example could result in N+1 queries loading all the variant records. To avoid these N+1 queries, use the named scopes on ActiveStorage::Attachment.
- anchor: transforming-images
  title: Transforming Images
  parent: Displaying Images, Videos, and PDFs
  body: |-
    Transforming images allows you to display the image at your choice of dimensions. To create a variation of an image, call variant on the attachment. You can pass any transformation supported by the variant processor to the method. When the browser hits the variant URL, Active Storage will lazily transform the original blob into the specified format and redirect to its new service location.

    It should be considered unsafe to provide arbitrary user supplied transformations or parameters to variant processors. This can potentially enable command injection vulnerabilities in your app.

    It is also recommended to implement a strict ImageMagick security policy when MiniMagick is the variant processor of choice, or when libvips is delegating to ImageMagick (run vips -l on your platform).

    If a variant is requested, Active Storage will automatically apply transformations depending on the image's format:

    Content types that are variable (as dictated by config.active_storage.variable_content_types) and not considered web images (as dictated by config.active_storage.web_image_content_types), will be converted to PNG.

    If quality is not specified, the variant processor's default quality for the format will be used.

    Active Storage can use either Vips or MiniMagick as the variant processor. The default depends on your config.load_defaults target version, and the processor can be changed by setting config.active_storage.variant_processor.

    Disabled Vips Image Loaders and Savers

    libvips marks some of its image loaders and savers as unfuzzed, meaning they should not be used to process untrusted content. Active Storage disables all of them while your application boots, before any initializer runs.

    Doing so requires libvips 8.13 or later and ruby-vips 2.2.1 or later, which are Active Storage's minimum supported versions. When ruby-vips is installed and either minimum is not met, Active Storage raises a RuntimeError while booting rather than run in an unsecurable environment. Upgrade libvips and ruby-vips.

    Notably, ImageMagick is marked as an unfuzzed loader and is disabled by default. On many platforms, libvips relies on ImageMagick to read BMP, ICO, and PSD files, so attachments in those formats cannot be transformed by default on those platforms. Attaching, storing, and downloading them is unaffected, but generating a variant raises Vips::Error, and analysis does not record their width and height.

    Analysis also does not record dimensions for other types that libvips reads with an unfuzzed loader, such as SVG, JPEG XL, JPEG 2000, and Netpbm. Those types are not in the default ActiveStorage.variable_content_types, so they are not variable in the first place.

    The savers marked unfuzzed are typically FITS, JXL, and ImageMagick, so requesting one of those as a variant's output format, such as variant(format: :jxl), also raises Vips::Error.

    An application that needs BMP, ICO, or PSD variants of trusted inputs can re-enable the ImageMagick loader in an initializer:

    Operation names and which of them are marked unfuzzed are both platform-dependent, so run vips -l to see the class hierarchy for your build.

    Re-enabling unfuzzed image loaders and savers is dangerous. You should only attempt this after researching how your distribution builds libvips and which library delegates are enabled.

    Even re-enabling only the ImageMagick loader, as illustrated above, is dangerous. libvips delegates many more file types to ImageMagick than just BMP, ICO, and PSD, so re-enabling it exposes a much larger attack surface. Do this only when all image uploads are trusted content, and only alongside a strict ImageMagick security policy.
- anchor: previewing-files
