slug: active_record_querying
title: Active Record Query Interface
description: Instead of using raw SQL to find database records, Active Record provides better ways to carry out the same operations. This guide covers different ways to retrieve data from the database using Active Record.
url: https://guides.rubyonrails.org/v8.1/active_record_querying.html
