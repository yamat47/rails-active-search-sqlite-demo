slug: i18n
title: Internationalization (I18n)
description: This guide covers how to add internationalization to your applications. Your application will be able to translate content to different languages, change pluralization rules, use correct date formats for each country, and so on.
url: https://guides.rubyonrails.org/v8.1/i18n.html
source: https://github.com/rails/rails/blob/v8.1.4/guides/source/i18n.md
ref: v8.1.4
sections:
- anchor: internationalization-and-localization
  title: Internationalization and Localization
  parent:
  body: |-
    Internationalization (I18n) is the process of preparing your application to support multiple languages and regional formats. In practice, this usually means abstracting strings and other locale-specific elements, such as date or currency formats, out of your application.

    Localization (L10n) is the process of providing translations and locale-specific formats for those abstracted pieces.

    To internationalize a Rails application, you typically need to:

    ensure your application is configured for internationalization (I18n)
    tell Rails where to find translation files
    set, preserve, and switch the locale for each request

    To localize your application, you typically need to:

    provide translations for application text
    add or customize locale-specific formats, such as dates, times, and currencies
    organize and maintain translation data
- anchor: how-i18n-in-ruby-on-rails-works
  title: How I18n in Ruby on Rails Works
  parent:
  body: |-
    Rails ships with the Ruby i18n gem, which provides the underlying internationalization framework. In this guide, the I18n API refers to the interface your Rails application uses to work with that framework, such as I18n.t, I18n.l, and Rails translation helpers. As part of this system, static strings in Rails itself, such as Active Record validation messages and time and date formats, are already internationalized.

    Rails includes core I18n functionality by default. Additional gems, such as rails-i18n, can provide extra locale data and other extensions, but they are not required for basic I18n support.

    The I18n API is primarily intended for translating user-facing text within the application. Translating model content itself (for example, blog posts stored in the database) requires a separate approach.

    The Ruby I18n gem is split into two parts:

    The public API of the I18n framework - a Ruby module with public methods that define how the library works.
    A default backend (named Simple backend) that implements these methods.

    As a user you should only access the public methods on the I18n module, but it is useful to know about the capabilities of the backend.

    It is possible to swap the shipped Simple backend with a more powerful one, which would store translation data in a relational database, GetText dictionary, or similar. See section Using alternate backends below.

    The most important methods of the I18n API are:

    translate, which looks up translations for a given key and locale. It is aliased as t, so you can use I18n.t("store.title"). Additionally, this helper catches missing translations and wraps the resulting error message in a <span class="translation_missing">.
    localize, which localizes Date and Time objects to local formats. It is aliased as l, so you can use I18n.l(Time.now).

    The I18n module also exposes configuration through attribute readers and writers:
