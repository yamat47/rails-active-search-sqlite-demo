- anchor: action-view-helper-methods
  title: Action View Helper Methods
  parent: Built-in Rails Translations
  body: |-
    Several Action View helpers use locale data for dates, times, numbers, and currency formatting.

    distance_of_time_in_words translates and pluralizes its result and interpolates the number of seconds, minutes, hours, and so on.

    It uses translations from the datetime.distance_in_words scope.

    relative_time_in_words builds on distance_of_time_in_words and adds a localized prefix/suffix depending on whether the time is in the past or future.

    It uses translations from the datetime.relative scope.

    datetime_select and select_month use translated month names for populating the resulting select tag.

    The rendered <option> labels come from translated month names in the date.month_names scope. datetime_select also looks up the order option from date.order (unless you pass the option explicitly). All date selection helpers translate the prompt using the translations in the datetime.prompts scope if applicable.

    The number_to_currency, number_with_precision, number_to_percentage, number_with_delimiter, and number_to_human_size helpers use the number format settings located in the number scope.
- anchor: active-model-methods
  title: Active Model Methods
  parent: Built-in Rails Translations
  body: |-
    Active Model uses translations for human-readable model names, attribute names, and validation error messages.

    model_name.human and human_attribute_name use translations for model names and attribute names if available in the activerecord.models and activerecord.attributes scopes.

    They also support translations for inherited class names (e.g. for use with STI) as explained above in "Error message scopes".

    ActiveModel::Errors#generate_message (which is used by Active Model validations but may also be used manually) uses model_name.human and human_attribute_name.

    It also translates the error message and supports translations for inherited class names as explained above in "Error message scopes".

    ActiveModel::Error#full_message and ActiveModel::Errors#full_messages prepend the attribute name to the error message using a format looked up from errors.format (default: "%{attribute} %{message}").

    To customize the default format, override it in the app's locale files. To customize the format per model or per attribute, see config.active_model.i18n_customize_full_message.
- anchor: active-support-methods
  title: Active Support Methods
  parent: Built-in Rails Translations
  body: |-
    Active Support also includes helpers that use locale-specific formatting rules.

    Array#to_sentence uses format settings from the support.array scope.
- anchor: configuring-the-load-paths-and-default-locale
  title: Configuring the load paths and default locale
  parent: Advanced Configuration and Setup
  body: |-
    Rails automatically adds translation files from config/locales to the translations load path. By default, this includes .rb and .yml files, and for many applications that is all you need.

    Rails' own translations are organized the same way. See, for example, the Active Model validation messages in activemodel/lib/active_model/locale/en.yml or the date and time formats in activesupport/lib/active_support/locale/en.yml. With the default Simple backend, you can store translations in YAML files or in plain Ruby hashes.

    The translations load path (I18n.load_path) is the list of translation files Rails loads automatically. You can customize it if you want a different directory structure or naming scheme.

    The backend lazy-loads these translations the first time a translation is looked up. You can still swap the backend implementation later if needed.

    To add more translation files or change the default locale, configure config.i18n in config/application.rb:

    The load path must be configured before any translations are looked up.

    If you need to work directly with i18n instead, for example in an initializer, you can do that as well:

    In general, prefer config.i18n.* in application configuration. Appending directly to I18n.load_path will not override translations from external gems in the same way.

    You can use YAML (.yml) or plain Ruby (.rb) files to store translations in the Simple backend. YAML is the format most Rails applications use, but it is sensitive to whitespace and special characters, so syntax mistakes can prevent a locale file from loading correctly.

    Ruby locale files can be useful when you want syntax errors to fail fast, or when you need values such as lambdas in your locale data.

    If your translations are stored in YAML files, certain keys must be escaped. They are:

    true, on, yes
    false, off, no

