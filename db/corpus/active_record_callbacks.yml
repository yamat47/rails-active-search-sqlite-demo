- anchor: skipping-callbacks
  title: Skipping Callbacks
  parent:
  body: |-
    Just as with validations, it is also possible to skip callbacks by using the following methods:

    decrement!
    decrement_counter
    delete
    delete_all
    delete_by
    increment!
    increment_counter
    insert
    insert!
    insert_all
    insert_all!
    touch_all
    update_column
    update_columns
    update_all
    update_counters
    upsert
    upsert_all

