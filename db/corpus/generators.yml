- anchor: what-are-generators-questionmark
  title: What are Generators?
  parent:
  body: |-
    When you create an application using the rails new command, you're using a Rails generator. Generators create specific files in your application and allow automating boilerplate code. You can get a list of all available generators by invoking bin/rails generate from within any Rails application:

    To create a Rails application we use the rails global command which uses the version of Rails installed via gem install rails. When inside the directory of your application, we use the bin/rails command which uses the version of Rails bundled with the application.

    You will get a list of all available generators along with usage instructions. For example, you can run a generator with the --pretend (or -p) option to get a sense of what a specific generator would do without actually making the changes:

    None of the above files are actually created with the --pretend option.

    The --pretend option can be handy to check the difference in files generated by related generators before actually running them. For example, model vs. resource generator.

    To see a detailed description of a particular generator, invoke the generator with the --help option. For example:

    The --help output is a good resource to learn more about a particular generator. It provides detailed usage instructions as well as examples.
