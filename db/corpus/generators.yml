- anchor: generator-resolution
  title: Generator Resolution
  parent:
  body: |-
    When resolving a generator's name, Rails looks for the generator using multiple file names. For example, when you run bin/rails generate initializer core_extensions, Rails tries to load each of the following files, in order, until one is found:

    rails/generators/initializer/initializer_generator.rb
    generators/initializer/initializer_generator.rb
    rails/generators/initializer_generator.rb
    generators/initializer_generator.rb

    If none of these are found, an error will be raised.

    We put our generator in the application's lib/ directory because that directory is in $LOAD_PATH (Ruby's list of directories searched when loading files), thus allowing Rails to find and load the generator files.

    $LOAD_PATH is initialized by Ruby and expanded by Bundler and Rails at boot time. Bundler adds each gem's lib/ directory, and Rails adds your application's lib/ directory, which is why generators placed there are findable. You can inspect the full load path by running bin/rails runner 'puts $LOAD_PATH'. You can modify it with config.autoload_paths in your application.rb file.
- anchor: overriding-rails-generators-and-templates
  title: Overriding Rails Generators and Templates
  parent:
  body: |-
    It's possible to override the built-in Rails generators and configure them via config.generators. As your Rails application grows, you may want to add your own methods to generated controllers, for example, or change the format of generated views.

    As an example of how to override a built-in generator, let's take a closer look at how the scaffold generator works.

    From the output, we can see that the scaffold generator invokes other generators, such as the scaffold_controller generator. And some of those generators invoke other generators too. In particular, the scaffold_controller generator invokes the helper generator.

    Let's see how to override the built-in helper generator with a new generator. We'll name the new generator my_helper. We create this generator using the generator command inside lib/generators/rails:

    And in the file my_helper_generator.rb, we'll define the generator as:

    Finally, we need to tell Rails to use the my_helper generator instead of the built-in helper generator. For that we use config.generators. In config/application.rb, let's add:

    Now if we run the scaffold generator again, we see the my_helper generator in action:

    You may notice that the output for the built-in helper generator includes "invoke test_unit", whereas the output for my_helper does not. Although the helper generator does not generate tests by default, it does provide a hook to do so using hook_for. We can do the same by including hook_for :test_framework, as: :helper in the MyHelperGenerator class. See the hook_for documentation for more information.
- anchor: overriding-generators-with-fallbacks
  title: Overriding Generators with Fallbacks
  parent: Overriding Rails Generators and Templates
  body: |-
    Another way to override specific generators is by using fallbacks. A fallback allows a generator namespace to delegate to another generator namespace when a matching generator is not found.

    For example, let's say we want to override the test_unit:model generator with our own my_test_unit:model generator, but we don't want to replace all of the other test_unit:* generators such as test_unit:controller. Instead of implementing every generator in the my_test_unit namespace, we can configure my_test_unit to fall back to test_unit for any generator we haven't explicitly defined.

    First, we create the my_test_unit:model generator in lib/generators/my_test_unit/model/model_generator.rb:

    Because my_test_unit is a custom namespace rather than an override of a Rails built-in generator, we place it in lib/generators/my_test_unit/ rather than lib/generators/rails/. Rails will find it via the normal load path lookup. We'll also need to register it as the test_framework via config.generators, which we'll do in the next step.

    Next, we use config.generators to configure the test_framework generator as my_test_unit, but we also configure a fallback such that any missing my_test_unit:* generators resolve to test_unit:*:

    Now when we run the scaffold generator, we see that my_test_unit has replaced test_unit, but only the model tests have been affected:

    Notice that the model invocation of my_test_unit only prints "Doing different stuff..." and creates no test file, because our custom generator doesn't create one. The controller and helper invocations of my_test_unit fall back to test_unit, which is why test/controllers/comments_controller_test.rb is still generated as normal.
- anchor: overriding-generator-templates
  title: Overriding Generator Templates
  parent: Overriding Rails Generators and Templates
  body: |-
    When resolving generator template files, Rails looks first in the application's lib/templates/ directory, then falls back to the generator's own source_root directory. This means we can override the templates used by Rails' built-in generators by placing our own versions in lib/templates/. For example, we could override the scaffold controller template or the scaffold view templates.

    To see this in action, let's create a lib/templates/erb/scaffold/index.html.erb.tt file with the content shown below. The extra .tt extension tells Rails that the file is a generator template that needs to be processed by Thor first (The .tt stands for "thor template").

    The template is an ERB template that renders another ERB template. So any <% that should appear in the resulting template must be escaped as <%% in the generator template.

