  body: |-
    In addition to generators provided by Rails, you can also build custom generators. Let's build a generator that creates an initializer file named hello_generator.rb inside config/initializers folder. We will do this manually first and then see how to do it using a generator command as well.

    Generators are built on top of Thor, which provides useful options for parsing and an API for manipulating files.

    The first step in manually creating a generator is to create a file named initializer_generator.rb inside lib/generators with the following content:

    The name of our generator based on the file and Ruby class name is initializer and it inherits from Rails::Generators::Base. When a generator is invoked, each public method in the generator is executed sequentially in the order that it is defined. Our new generator is intentionally simple, it has only one method definition. The method invokes create_file, which will create a file at the given destination with the given content.

    To invoke our new generator, we run:

    This will create an empty file named hello_generator.rb within the config/initializers folder.

    Before we go on, let's check the description of our new generator:

    Rails is usually able to derive a good description if a generator is namespaced, such as ActiveRecord::Generators::ModelGenerator, but not in this case. We can solve this problem in two ways. The first way is to add a description by calling desc inside our generator:

    Now we can see the description by invoking --help on the new generator.

    The second way to add a description is by creating a file named USAGE in the same directory as our generator. We are going to do that in the next step.
